name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Run unit tests for the vote service
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vote
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: vote/coverage.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Security scan with Trivy
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (repo scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          output: trivy-report.txt

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-report.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build & Push Images to GitHub Container Registry (Zero External Secrets!)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        run: |
          echo "REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Vote image ────────────────────────────────────────────────────────────
      - name: Build and push vote image
        uses: docker/build-push-action@v5
        with:
          context: ./vote
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/voting-app-vote:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/voting-app-vote:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Result image ──────────────────────────────────────────────────────────
      - name: Build and push result image
        uses: docker/build-push-action@v5
        with:
          context: ./result
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/voting-app-result:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/voting-app-result:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Worker image ──────────────────────────────────────────────────────────
      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/voting-app-worker:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/voting-app-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Deploy and Validate Kubernetes Manifests on Kind (Simulated EKS Cluster)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes (KinD)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create KinD (Kubernetes-in-Docker) Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: voting-app-cluster

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Deploy with Helm
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm upgrade --install voting-app ./capstone-1/helm/voting-app \
            --namespace voting-app \
            --create-namespace \
            --set image.registry=ghcr.io \
            --set vote.image.repository=${REPO_OWNER}/voting-app-vote \
            --set result.image.repository=${REPO_OWNER}/voting-app-result \
            --set worker.image.repository=${REPO_OWNER}/voting-app-worker \
            --set vote.service.type=ClusterIP \
            --set result.service.type=ClusterIP \
            --set image.tag=${{ github.sha }}

      - name: Verify Workloads & Pods
        run: |
          echo "=== Waiting for deployments to roll out ==="
          kubectl rollout status deployment/voting-app-vote -n voting-app --timeout=3m || true
          kubectl rollout status deployment/voting-app-result -n voting-app --timeout=3m || true
          kubectl rollout status deployment/voting-app-worker -n voting-app --timeout=3m || true
          echo "=== Deployments ==="
          kubectl get deployments -n voting-app
          echo "=== Pods ==="
          kubectl get pods -n voting-app -o wide
          echo "=== Services ==="
          kubectl get svc -n voting-app -o wide

      - name: Test Rollback Mechanism
        run: |
          echo "=== Rollback Test ==="
          helm history voting-app -n voting-app
          helm rollback voting-app 1 -n voting-app
          kubectl rollout status deployment/voting-app-vote -n voting-app --timeout=60s || true
          echo "✅ Rollback verified successfully!"
